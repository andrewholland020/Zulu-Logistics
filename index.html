<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZULU Logistics Dispatch Portal</title><style>[hidden]{display:none!important}</style></head><body><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<style>
/* Layout: fixed left rail (collapses to a scrolling top bar on phones) beside a single working column. Brand plate is styled like a highway guide sign. */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface2:#f3f4f6; --rail:#14305a; --rail-ink:#c3cfe2; --rail-line:rgba(255,255,255,.16); --rail-accent:#8fd9ba; --ink:#13202b; --muted:#5a6a77; --line:#d8dce1;
  --accent:#0b6b4f; --accent-ink:#ffffff; --accent-soft:#dcefe7;
  --warn:#8f4f00; --warn-soft:#fbebd0; --bad:#b3261e; --bad-soft:#f9dedc; --info:#1f5c99; --info-soft:#ddebf8;
  --neutral-soft:#e6eaed;
  --font-display:'Cabin',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-body:'Cabin',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-mono:'Cabin',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;margin:0;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:700;letter-spacing:.01em;text-wrap:balance}
h1{font-size:1.9rem;line-height:1.15}
h2{font-size:1.2rem;line-height:1.3}
.mono{font-family:var(--font-mono);font-size:.95em;font-weight:500;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:.86rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.45rem .8rem;border-radius:4px;cursor:pointer;font-weight:500;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:.25rem .55rem;font-size:.86rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500;text-decoration:underline;text-underline-offset:2px}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--rail)}
.logincard{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:28px 24px;display:grid;gap:18px}
.plate{display:inline-grid;gap:2px;background:var(--accent);color:var(--accent-ink);border:2px solid var(--accent-ink);outline:3px solid var(--accent);border-radius:6px;padding:8px 14px;width:fit-content}
.plate b{font-family:var(--font-display);font-size:1.25rem;letter-spacing:.05em;text-transform:uppercase;line-height:1.15}
.plate span{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.roles input{position:absolute;opacity:0;pointer-events:none}
.roles label{border:1px solid var(--line);border-radius:4px;padding:.55rem .4rem;text-align:center;cursor:pointer;font-weight:500;background:var(--surface2)}
.roles input:checked+label{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.roles input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--bad);min-height:1.2em;font-size:.9rem}

/* app shell */
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);border-right:0;padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;align-self:start}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav button{text-align:left;background:none;border:0;border-radius:4px;padding:.5rem .7rem;cursor:pointer;font-weight:500;color:var(--rail-ink);border-left:3px solid transparent}
.rail nav button:hover{background:rgba(255,255,255,.1);color:#fff}
.rail nav button[aria-current="page"]{background:rgba(255,255,255,.16);color:#fff;font-weight:700;border-left-color:var(--rail-accent)}
.rail .plate{background:#fff;color:var(--rail);border-color:var(--rail);outline:2px solid #fff}
.who .muted{color:var(--rail-ink)}
.who{margin-top:auto;display:grid;gap:6px;border-top:1px solid var(--rail-line);padding-top:12px}
.main{padding:24px 28px 48px;min-width:0;display:grid;gap:20px;align-content:start}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pagehead .sub{color:var(--muted);margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.banner{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:.55rem .8rem;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0}
.panel>header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel .pad{padding:14px 16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:6px}
.stat{padding:14px 16px;display:grid;gap:2px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat .k{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.stat .v{font-family:var(--font-display);font-size:1.7rem;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .d{font-size:.84rem;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}

/* tables */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:680px}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;font-weight:600;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.num{text-align:right}
td .stack{display:grid;gap:1px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.rowact{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}

/* pills */
.pill{display:inline-block;padding:.12rem .55rem;border-radius:99px;font-size:.78rem;font-weight:600;white-space:nowrap}
.p-booked{background:var(--neutral-soft);color:var(--muted)}
.p-transit{background:var(--info-soft);color:var(--info)}
.p-delivered{background:var(--warn-soft);color:var(--warn)}
.p-invoiced,.p-sent{background:var(--info-soft);color:var(--info)}
.p-paid,.p-issued{background:var(--accent-soft);color:var(--accent)}
.p-overdue{background:var(--bad-soft);color:var(--bad)}

/* toolbar + forms */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:.25rem .75rem;cursor:pointer;font-size:.86rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:.45rem .6rem;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.toolbar input[type=search]{max-width:240px;margin-left:auto}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form .full{grid-column:1/-1}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.field small{color:var(--muted);font-size:.8rem}
.formfoot{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding-top:6px}

/* ready-to-invoice rows */
.readyrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.readyrow:last-child{border-bottom:0}
.readyrow .l{display:grid;gap:1px;min-width:0}

/* modal */
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:start center;overflow-y:auto;padding:24px 12px}
.scrim{position:fixed;inset:0;background:rgba(8,14,18,.6)}
.sheet{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:6px;width:100%;max-width:560px;padding:20px;display:grid;gap:16px;margin-block:auto}
.sheet.wide{max-width:820px}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.copybox{width:100%;min-height:120px;font-family:var(--font-mono);font-size:.82rem}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:.5rem .9rem;border-radius:4px;z-index:60;font-weight:500;max-width:90vw}

/* documents (invoice / payslip) */
.doc{border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:22px;display:grid;gap:18px;min-width:0}
.doc .top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.doc .no{font-family:var(--font-display);font-size:1.8rem;letter-spacing:.02em;line-height:1.1}
.doc .addr{white-space:pre-line}
.doc .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.doc .meta div{display:grid;gap:1px}
.doc .meta b,.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.doc table{min-width:560px}
.doc .totals{margin-left:auto;display:grid;gap:4px;min-width:240px}
.doc .totals div{display:flex;justify-content:space-between;gap:20px;font-variant-numeric:tabular-nums}
.doc .totals .grand{border-top:2px solid var(--ink);padding-top:6px;font-weight:700;font-size:1.15rem}
.doc .foot{border-top:1px solid var(--line);padding-top:10px;color:var(--muted);font-size:.86rem;white-space:pre-line}

/* company report */
.rsec{display:grid;gap:14px;min-width:0}
.rsec h2{font-size:1.45rem}
.bar{height:6px;background:var(--neutral-soft);border-radius:2px;margin-top:5px;min-width:90px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.neg{color:var(--bad)}
table.tight th,table.tight td{padding-left:9px;padding-right:9px}
.dwrap{display:flex;gap:6px;align-items:center;min-width:0;width:100%}
.dwrap input{flex:1;min-width:0}
.calbtn{display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;width:34px;height:34px;flex:none;cursor:pointer;padding:0}
.calbtn:hover{background:var(--surface2)}
#cal{position:fixed;z-index:80;width:276px;max-width:calc(100vw - 16px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px;box-shadow:0 8px 28px rgba(10,20,40,.22);display:grid;gap:8px}
.calhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.calnav{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;width:30px;height:30px;cursor:pointer;font-size:1.1rem;line-height:1;padding:0}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.calgrid .wd{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0}
.calgrid button,.calmonths button{border:0;background:none;color:var(--ink);border-radius:4px;height:32px;cursor:pointer;font-variant-numeric:tabular-nums;padding:0}
.calgrid button:hover,.calmonths button:hover{background:var(--surface2)}
.calgrid button.today,.calmonths button.today{box-shadow:inset 0 0 0 1px var(--accent)}
.calgrid button.sel,.calmonths button.sel{background:var(--accent);color:var(--accent-ink);font-weight:700}
.calmonths{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.calmonths button{height:38px}
.calfoot{display:flex;justify-content:space-between}
.panelish{border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--surface2);align-items:end}
.mailbox{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.bar i.full{background:var(--bad)}
tr.quiet td{color:var(--muted)}
tr.total td{font-weight:700;border-top:2px solid var(--ink);background:var(--surface2)}

@media (max-width:900px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(3){border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;padding:10px 16px;gap:10px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .rail nav{flex-direction:row}
  .rail nav button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}
  .rail nav button[aria-current="page"]{border-bottom-color:var(--rail-accent)}
  .who{margin-top:0;border-top:0;padding-top:0;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .main{padding:18px 16px 40px}
  .form{grid-template-columns:minmax(0,1fr)}
  .toolbar input[type=search]{max-width:none;margin-left:0;flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.amt{max-width:130px;margin-left:auto;text-align:right}
.addline{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.addline select{flex:1;min-width:200px}
.invprev{display:flex;align-items:baseline;gap:12px;justify-content:flex-end;flex-wrap:wrap;border-top:2px solid var(--ink);padding-top:8px}
.invprev b{font-size:1.25rem;font-variant-numeric:tabular-nums}
</style>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var KEY='dispatchPortal.v1';
var MONEY=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
var NUM=new Intl.NumberFormat('en-US');
function money(n){return MONEY.format(Number(n)||0);}
function r2(n){return Math.round((Number(n)+Number.EPSILON)*100)/100;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
var TODAY=iso(new Date());
function parts(s){var p=String(s).split('-').map(Number);return p;}
function fmtD(s){if(!s)return '—';var p=parts(s);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function addDays(s,n){var p=parts(s);return iso(new Date(p[0],p[1]-1,p[2]+n));}
function ymLabel(ym){var p=parts(ym+'-01');return new Date(p[0],p[1]-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});}
function uid(p){return p+'_'+Math.random().toString(36).slice(2,9);}
function $(id){return document.getElementById(id);}

/* ---------- data ---------- */
var db=null, session=null, storageOk=true;
var ui={page:'overview',status:'All',q:'',invFilter:'All',ym:TODAY.slice(0,7),reportYm:TODAY.slice(0,7),reportYear:TODAY.slice(0,4),dispDate:TODAY,drvPeriod:'Week',drvDate:TODAY,drvMonth:TODAY.slice(0,7),ovPeriod:'Week',ovDate:TODAY,ovMonth:TODAY.slice(0,7),ovYear:TODAY.slice(0,4)};

/* ---------- shared database (Supabase) ---------- */
var SB_URL='https://ppwhvoemfkuiwckudlhm.supabase.co';
var SB_KEY='sb_publishable_5sgHPnVLB8R6xtEyjCZggQ_hIZ88-DZ';
var sb=null,synced={},saveQ=Promise.resolve(),pending=0,saveErr='',loadsLite=[],profiles=[],pollT=null;
var COLLS=['drivers','customers','employees','loads','invoices','payslips','expenses'];
function canWrite(coll){
  var r=session&&session.role;
  if(r==='admin')return true;
  if(r==='accountant')return coll!=='expenses';
  if(r==='dispatcher')return coll==='loads'||coll==='drivers'||coll==='customers';
  return false;
}
function snapshot(){
  var m={};
  function add(coll,id,data,ids){ids=ids||[];m[coll+'|'+id]={coll:coll,id:id,data:data,ids:ids,sig:JSON.stringify(data)+'|'+ids.join(',')};}
  db.drivers.forEach(function(x){add('drivers',x.id,x);});
  db.customers.forEach(function(x){add('customers',x.id,x);});
  db.employees.forEach(function(e){
    var pub=Object.assign({},e);delete pub.base;delete pub.commissionPct;delete pub.pin;
    add('employees',e.id,pub);
    if(e.base!==undefined||e.commissionPct!==undefined)add('emp_pay',e.id,{id:e.id,base:e.base||0,commissionPct:e.commissionPct||0});
  });
  db.loads.forEach(function(l){add('loads',l.id,l,[l.dispatcherId||'']);});
  db.invoices.forEach(function(i){
    var ids=[];i.loadIds.forEach(function(id){var l=getLoad(id);if(l&&l.dispatcherId&&ids.indexOf(l.dispatcherId)<0)ids.push(l.dispatcherId);});
    add('invoices',i.id,i,ids.sort());
  });
  db.payslips.forEach(function(x){add('payslips',x.id,x);});
  db.expenses.forEach(function(x){add('expenses',x.id,x);});
  var st=Object.assign({},db.settings);delete st.pins;
  add('meta','settings',st);
  add('payroll','fx',{v:db.fx});
  add('payroll','payAdj',{v:db.payAdj});
  return m;
}
function setSave(){
  var el=$('saveState');if(!el)return;
  el.textContent=pending?'Saving…':(saveErr?'Not saved. Reloading.':'All changes saved');
}
function persist(){
  if(!sb||!session)return;
  var snap=snapshot(),up=[],del={};
  Object.keys(snap).forEach(function(k){var s=snap[k];if(canWrite(s.coll)&&synced[k]!==s.sig)up.push(s);});
  Object.keys(synced).forEach(function(k){
    if(snap[k])return;var c=k.split('|')[0],id=k.slice(c.length+1);
    if(!canWrite(c))return;(del[c]=del[c]||[]).push(id);
  });
  if(!up.length&&!Object.keys(del).length)return;
  up.forEach(function(s){synced[s.coll+'|'+s.id]=s.sig;});
  Object.keys(del).forEach(function(c){del[c].forEach(function(id){delete synced[c+'|'+id];});});
  pending++;saveErr='';setSave();
  saveQ=saveQ.then(async function(){
    var now=new Date().toISOString();
    for(var i=0;i<up.length;i+=200){
      var rows=up.slice(i,i+200).map(function(s){return {coll:s.coll,id:s.id,data:s.data,dispatcher_ids:s.ids,updated_at:now};});
      var r=await sb.from('records').upsert(rows,{onConflict:'coll,id'});
      if(r.error)throw r.error;
    }
    var cs=Object.keys(del);
    for(var j=0;j<cs.length;j++){
      var r2=await sb.from('records').delete().eq('coll',cs[j]).in('id',del[cs[j]]);
      if(r2.error)throw r2.error;
    }
  }).then(function(){pending--;setSave();},function(err){
    pending--;saveErr=(err&&err.message)||'error';setSave();
    toast('Could not save: '+saveErr);
    refreshData(true);
  });
}
async function fetchAll(table,select){
  var out=[],from=0,step=1000;
  for(;;){
    var q=sb.from(table).select(select);
    if(table==='records')q=q.order('coll').order('id');
    var r=await q.range(from,from+step-1);
    if(r.error)throw r.error;
    out=out.concat(r.data||[]);
    if(!r.data||r.data.length<step)break;
    from+=step;
  }
  return out;
}
function lastNum(s){var m=/(\d+)\s*$/.exec(String(s||''));return m?Number(m[1]):0;}
function buildDb(rows){
  var d=blank(),pay={},have={};
  rows.forEach(function(r){
    have[r.coll+'|'+r.id]=1;
    if(COLLS.indexOf(r.coll)>-1)d[r.coll].push(r.data);
    else if(r.coll==='emp_pay')pay[r.id]=r.data;
    else if(r.coll==='meta'&&r.id==='settings')Object.assign(d.settings,r.data);
    else if(r.coll==='payroll'&&r.id==='fx')d.fx=r.data.v||{};

  });

function migrateV4(d){

  });

function migrateV3(d){
  d=migrateV2(d);
  if(d.v>=3)return d;
  var RATE=280;
  d.fx=d.fx||{};d.payAdj=d.payAdj||{};
  d.employees.forEach(function(e){e.base=Math.round((Number(e.base)||0)*RATE);delete e.deductPct;});
  d.drivers.forEach(function(x){if(x.email===undefined)x.email='';});
  d.customers.forEach(function(c){if(c.contact===undefined){c.contact='';c.phone='';c.ext='';c.loadLimit=0;c.limitPeriod='Month';}});
  d.loads.forEach(function(l){if(l.deadhead===undefined)l.deadhead=0;});
  d.payslips.forEach(function(p){
    if(p.feesUsd!==undefined)return;
    p.rate=RATE;p.feesUsd=p.fees||0;
    p.base=Math.round((p.base||0)*RATE);p.commission=Math.round((p.commission||0)*RATE);
    p.gross=p.base+p.commission;p.fines=0;p.fineNote='';p.net=p.gross;
    delete p.fees;delete p.deduction;delete p.deductPct;
    if(d.fx[p.ym]==null)d.fx[p.ym]=RATE;
  });
  if(d.seeded){
    var ex=seed();
    if(d.fx['2026-09']==null)d.fx['2026-09']=RATE;
    if(d.fx['2026-10']==null)d.fx['2026-10']=RATE;
    ex.employees.forEach(function(x){var e=d.employees.find(function(y){return y.id===x.id&&y.name===x.name;});if(e){e.base=x.base;e.commissionPct=x.commissionPct;}});
    ex.drivers.forEach(function(x){var r=d.drivers.find(function(y){return y.id===x.id;});if(r&&!r.email)r.email=x.email;});
    ex.customers.forEach(function(x){var c=d.customers.find(function(y){return y.id===x.id&&y.name===x.name;});if(c&&!c.contact){c.contact=x.contact;c.phone=x.phone;c.ext=x.ext;c.email=x.email;c.loadLimit=x.loadLimit;c.limitPeriod=x.limitPeriod;}});
    ex.loads.forEach(function(x){var l=d.loads.find(function(y){return y.id===x.id;});if(l&&!l.deadhead)l.deadhead=x.deadhead;});
    Object.keys(ex.payAdj).forEach(function(k){if(!d.payAdj[k])d.payAdj[k]=ex.payAdj[k];});
  }
  d.v=3;
  return d;
}
function migrateV2(d){

  var lm={},dm={};
  d.loads.forEach(function(l){if(l.extras){l.rate=r2(l.rate+l.extras);}l.extras=0;lm[l.id]=l;});
  d.drivers.forEach(function(x){dm[x.id]=x;});
  d.invoices.forEach(function(inv){
    inv.fees={};var t=0;

function dateInput(id,name,val,kind,attrs){
  var month=kind==='month';
  return '<span class="dwrap"><input id="'+id+'"'+(name?' name="'+name+'"':'')+' type="text" class="datefld" data-kind="'+kind+'" value="'+esc(val)+'" placeholder="'+(month?'YYYY-MM':'YYYY-MM-DD')+'" pattern="'+(month?'\\d{4}-(0[1-9]|1[0-2])':'\\d{4}-\\d{2}-\\d{2}')+'" title="'+(month?'Type YYYY-MM or pick from the calendar':'Type YYYY-MM-DD or pick from the calendar')+'" autocomplete="off" inputmode="numeric" '+(attrs||'')+'>'+
    '<button class="calbtn" type="button" data-action="open-cal" data-for="'+id+'" aria-label="Open calendar" title="Open calendar">'+CAL_ICON+'</button></span>';
}
function openCal(forId){
  var inp=$(forId);if(!inp)return;
  var kind=inp.dataset.kind||'date';
  var base=kind==='month'?(okMonth(inp.value)?inp.value+'-01':TODAY.slice(0,7)+'-01'):(okDate(inp.value)?inp.value:TODAY);
  var p=parts(base);
  CAL={target:forId,kind:kind,y:p[0],m:p[1]};
  drawCal();
}
function closeCal(){CAL=null;var c=$('cal');if(c&&c.parentNode)c.parentNode.removeChild(c);}
function drawCal(){
  if(!CAL)return;
  var inp=$(CAL.target);if(!inp){closeCal();return;}
  var el=$('cal');
  if(!el){el=document.createElement('div');el.id='cal';el.setAttribute('role','dialog');el.setAttribute('aria-label','Calendar');document.body.appendChild(el);}
  var cur=inp.value,html;
  if(CAL.kind==='month'){
    var mm='';
    for(var m=1;m<=12;m++){
      var v=CAL.y+'-'+pad(m);
      mm+='<button type="button" data-action="cal-pick" data-v="'+v+'" class="'+(v===cur?'sel ':'')+(v===TODAY.slice(0,7)?'today':'')+'">'+new Date(2000,m-1,1).toLocaleDateString('en-US',{month:'short'})+'</button>';
    }
    html='<div class="calhead"><button type="button" class="calnav" data-action="cal-nav" data-d="-12" aria-label="Previous year">‹</button><b>'+CAL.y+'</b><button type="button" class="calnav" data-action="cal-nav" data-d="12" aria-label="Next year">›</button></div><div class="calmonths">'+mm+'</div>';
  } else {
    var first=(new Date(CAL.y,CAL.m-1,1).getDay()+6)%7,days=new Date(CAL.y,CAL.m,0).getDate(),g='';
    ['Mo','Tu','We','Th','Fr','Sa','Su'].forEach(function(w){g+='<span class="wd">'+w+'</span>';});
    for(var i=0;i<first;i++)g+='<span class="blank"></span>';
    for(var d=1;d<=days;d++){
      var dv=CAL.y+'-'+pad(CAL.m)+'-'+pad(d);
      g+='<button type="button" data-action="cal-pick" data-v="'+dv+'" class="'+(dv===cur?'sel ':'')+(dv===TODAY?'today':'')+'" aria-label="'+esc(fmtD(dv))+'">'+d+'</button>';
    }
    html='<div class="calhead"><button type="button" class="calnav" data-action="cal-nav" data-d="-1" aria-label="Previous month">‹</button><b>'+esc(ymLabel(CAL.y+'-'+pad(CAL.m)))+'</b><button type="button" class="calnav" data-action="cal-nav" data-d="1" aria-label="Next month">›</button></div><div class="calgrid">'+g+'</div>';
  }
  html+='<div class="calfoot"><button class="btn sm" type="button" data-action="cal-today">Today</button><button class="btn sm" type="button" data-action="close-cal">Close</button></div>';
  el.innerHTML=html;
  var r=inp.getBoundingClientRect(),w=el.offsetWidth||276,h=el.offsetHeight||300;
  var left=Math.max(8,Math.min(r.left,window.innerWidth-w-8));
  var top=r.bottom+6;
  if(top+h>window.innerHeight-8&&r.top-h-6>8)top=r.top-h-6;
  el.style.left=left+'px';el.style.top=Math.max(8,top)+'px';
}
function calPick(v){
  var inp=CAL&&$(CAL.target);if(!inp)return;
  inp.value=v;
  inp.dispatchEvent(new Event('input',{bubbles:true}));
  inp.dispatchEvent(new Event('change',{bubbles:true}));
  closeCal();
  var again=$(inp.id);if(again)again.focus();
}

    case 'customers':return pCustomers();
    case 'invoices':return pInvoices();
    case 'payroll':return pPayroll();

  }

function head(title,sub,actions){
  return '<div class="pagehead"><div><h1>'+esc(title)+'</h1>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</div><div class="actions">'+(actions||'')+'</div></div>';
}

/* ---------- overview (weekly) ---------- */
function weekRange(ref){
  ref=ref||TODAY;
  var p=parts(ref),dt=new Date(p[0],p[1]-1,p[2]),dow=(dt.getDay()+6)%7;
  var start=addDays(ref,-dow);
  return {start:start,end:addDays(start,6)};
}
function inWeek(s,w){return !!s&&s>=w.start&&s<=w.end;}
function fmtShort(s){var p=parts(s);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function weekLabel(w){return fmtShort(w.start)+' to '+fmtShort(w.end)+', '+w.end.slice(0,4);}
function isDone(l){return l.status==='Delivered'||l.status==='Invoiced'||l.status==='Paid';}
function onRoad(l,w){return l.status==='In transit'||(l.status==='Booked'&&(inWeek(l.pickup,w)||inWeek(l.delivery,w)));}
function sumBy(a,f){return r2(a.reduce(function(s,x){return s+f(x);},0));}
function plural(n,w){return n+' '+w+(n===1?'':'s');}
function statTile(k,v,d){return '<div class="stat"><span class="k">'+esc(k)+'</span><span class="v">'+esc(v)+'</span><span class="d">'+esc(d)+'</span></div>';}
function loadLine(l){
  return '<div class="readyrow"><div class="l"><b><span class="mono">'+esc(l.ref)+'</span> · '+esc(l.origin)+' to '+esc(l.dest)+'</b><span class="muted small">'+esc(nm(getDrv(l.driverId)))+' · '+fmtShort(l.pickup)+' to '+fmtShort(l.delivery)+'</span></div>'+pill(l.status)+'</div>';
}
function readyGroups(){
  var g={};
  db.loads.forEach(function(l){
    if(l.status!=='Delivered')return;
    var k=l.driverId;
    (g[k]=g[k]||{driverId:l.driverId,loads:[]}).loads.push(l);
  });
  return Object.keys(g).map(function(k){
    var x=g[k];x.total=r2(x.loads.reduce(function(a,l){return a+loadFee(l);},0));return x;
  });
}
function pOverview(){return session.role==='dispatcher'?pOverviewDispatcher():pOverviewAdmin();}

function pOverviewDispatcher(){
  var w=weekRange(ui.dispDate),me=getEmp(session.empId),cur=inWeek(TODAY,w);
  var mine=db.loads.filter(function(l){return l.dispatcherId===session.empId;});
  var wk=mine.filter(function(l){return (cur&&l.status==='In transit')||inWeek(l.pickup,w)||inWeek(l.delivery,w);})
    .sort(function(a,b){return String(a.pickup).localeCompare(String(b.pickup));});
  var left=wk.filter(function(l){return l.status==='Booked'||l.status==='In transit';});
  var done=mine.filter(function(l){return isDone(l)&&inWeek(l.delivery,w);});
  return head('Overview','Week of '+weekLabel(w)+(me?' · '+me.name:''),'<div style="width:220px">'+dateInput('dispDate','',ui.dispDate,'date','aria-label="Any day in the week"')+'</div>')+
  '<div class="stats">'+
    statTile('Loads this week',String(wk.length),plural(left.length,'load')+' still to move')+
    statTile('Delivered this week',String(done.length),'completed loads')+
    statTile('Load revenue',money(sumBy(done,function(l){return l.rate;})),'on loads delivered this week')+
    statTile('Dispatch fees',money(sumBy(done,loadFee)),'earned on those loads')+
  '</div>'+
  driverWeek(wk)+
  '<section class="panel"><header><h2>My loads this week</h2><div class="actions"><button class="btn sm" type="button" data-action="nav" data-page="myreport">Month and year</button><button class="btn sm" type="button" data-action="nav" data-page="loads">All my loads</button></div></header>'+
    (wk.length?wk.map(loadLine).join(''):'<div class="empty">No loads this week. Add one on the Loads page.</div>')+'</section>';
}

function driverWeek(wk){
  var by={};
  db.drivers.forEach(function(x){if(x.dispatcherId===session.empId)by[x.id]={id:x.id,n:0,loaded:0,dead:0,rev:0};});
  wk.forEach(function(l){var a=by[l.driverId]=by[l.driverId]||{id:l.driverId,n:0,loaded:0,dead:0,rev:0};a.n++;a.loaded+=l.miles;a.dead+=(l.deadhead||0);a.rev+=l.rate;});
  var list=Object.keys(by).map(function(k){return by[k];}).sort(function(a,b){return b.loaded+b.dead-a.loaded-a.dead;});
  var t={n:0,loaded:0,dead:0,rev:0};
  var rows=list.map(function(a){
    t.n+=a.n;t.loaded+=a.loaded;t.dead+=a.dead;t.rev+=a.rev;
    var dr=getDrv(a.id);
    return '<tr'+(a.n?'':' class="quiet"')+'><td><div class="stack"><b>'+esc(nm(dr))+'</b><span class="muted small">'+esc(dr?dr.carrier:'')+'</span></div></td><td class="num">'+a.n+'</td><td class="num">'+NUM.format(a.loaded)+'</td><td class="num">'+NUM.format(a.dead)+'</td><td class="num"><b>'+NUM.format(a.loaded+a.dead)+'</b></td><td class="num">'+money(a.rev)+'</td></tr>';}).join('');
  return '<section class="panel"><header><div><h2>Drivers this week</h2><div class="muted small">Revenue miles are loaded miles. Total miles include deadhead.</div></div></header>'+
    (rows?'<div class="tablewrap"><table style="min-width:640px"><thead><tr><th>Driver</th><th class="num">Loads</th><th class="num">Load revenue miles</th><th class="num">Deadhead miles</th><th class="num">Total miles</th><th class="num">Load revenue</th></tr></thead><tbody>'+rows+
    '<tr class="total"><td>Total</td><td class="num">'+t.n+'</td><td class="num">'+NUM.format(t.loaded)+'</td><td class="num">'+NUM.format(t.dead)+'</td><td class="num">'+NUM.format(t.loaded+t.dead)+'</td><td class="num">'+money(r2(t.rev))+'</td></tr></tbody></table></div>':'<div class="empty">No drivers or loads for you this week.</div>')+'</section>';
}
function myMonth(ym){
  var ls=db.loads.filter(function(l){return l.dispatcherId===session.empId&&isDone(l)&&String(l.delivery).slice(0,7)===ym;});
  return {ym:ym,loads:ls,count:ls.length,rev:sumBy(ls,function(l){return l.rate;}),fees:sumBy(ls,loadFee),
    miles:ls.reduce(function(a,l){return a+l.miles;},0),deadhead:ls.reduce(function(a,l){return a+(l.deadhead||0);},0)};
}
function pMyReport(){
  var me=getEmp(session.empId),ym=ui.reportYm,yr=ui.reportYear;
  var ms=myMonth(ym);
  var set={};set[TODAY.slice(0,4)]=1;set[yr]=1;
  db.loads.forEach(function(l){if(l.dispatcherId===session.empId&&l.delivery)set[String(l.delivery).slice(0,4)]=1;});
  var years=Object.keys(set).sort().reverse();
  var rows=ms.loads.slice().sort(function(a,b){return String(b.delivery).localeCompare(String(a.delivery));}).map(function(l){
    return '<tr><td><span class="mono">'+esc(l.ref)+'</span></td><td>'+esc(nm(getDrv(l.driverId)))+'</td><td>'+esc(nm(getCust(l.customerId),'name'))+'</td><td>'+fmtD(l.delivery)+'</td><td class="num">'+NUM.format(l.miles)+'</td><td class="num">'+money(l.rate)+'</td><td class="num">'+money(loadFee(l))+'</td></tr>';}).join('');
  var months=[];for(var m=1;m<=12;m++)months.push(myMonth(yr+'-'+pad(m)));
  var maxF=Math.max.apply(null,months.map(function(x){return x.fees;}).concat([1]));
  var tot={count:0,rev:0,fees:0,miles:0};
  var yrows=months.map(function(s,i){
    tot.count+=s.count;tot.rev+=s.rev;tot.fees+=s.fees;tot.miles+=s.miles;
    if(!s.count)return '<tr class="quiet"><td>'+monthName(i+1)+'</td><td class="num">—</td><td class="num">—</td><td class="num">—</td><td class="num">—</td></tr>';
    return '<tr><td>'+monthName(i+1)+'</td><td class="num">'+s.count+'</td><td class="num">'+money(s.rev)+'</td><td class="num">'+money(s.fees)+'<div class="bar" aria-hidden="true"><i style="width:'+Math.round(s.fees/maxF*100)+'%"></i></div></td><td class="num">'+NUM.format(s.miles)+'</td></tr>';}).join('');
  tot.rev=r2(tot.rev);tot.fees=r2(tot.fees);
  return head('My report','Your own loads and revenue by month and year'+(me?' · '+me.name:''))+
  '<div class="rsec"><div class="pagehead"><div><h2>Month</h2><div class="sub">'+esc(ymLabel(ym))+'</div></div>'+
    '<label class="field" style="grid-template-columns:auto 170px;align-items:center;gap:10px"><span>Month</span>'+dateInput('reportMonth','',ym,'month','')+'</label></div>'+
  '<div class="stats">'+
    statTile('Loads delivered',String(ms.count),'in '+ymLabel(ym))+
    statTile('Load revenue',money(ms.rev),'total load rates')+
    statTile('Dispatch fees',money(ms.fees),'earned on your loads')+
    statTile('Miles',NUM.format(ms.miles),NUM.format(ms.deadhead)+' deadhead miles')+
  '</div>'+
  '<section class="panel"><header><h2>Loads delivered this month</h2></header>'+(rows?'<div class="tablewrap"><table style="min-width:640px"><thead><tr><th>Load</th><th>Driver</th><th>Broker</th><th>Delivered</th><th class="num">Miles</th><th class="num">Load rate</th><th class="num">Dispatch fee</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="empty">No deliveries in this month.</div>')+'</section></div>'+
  '<div class="rsec"><div class="pagehead"><div><h2>Year</h2><div class="sub">January to December '+esc(yr)+'</div></div>'+
    '<label class="field" style="grid-template-columns:auto 120px;align-items:center;gap:10px"><span>Year</span><select id="reportYear">'+years.map(function(y){return '<option value="'+y+'"'+(y===yr?' selected':'')+'>'+y+'</option>';}).join('')+'</select></label></div>'+
  '<div class="stats">'+
    statTile('Loads delivered',String(tot.count),'in '+yr)+
    statTile('Load revenue',money(tot.rev),'total load rates')+
    statTile('Dispatch fees',money(tot.fees),'earned on your loads')+
    statTile('Miles',NUM.format(tot.miles),'loaded miles')+
  '</div>'+
  '<section class="panel"><div class="tablewrap"><table style="min-width:520px"><thead><tr><th>Month</th><th class="num">Loads</th><th class="num">Load revenue</th><th class="num">Dispatch fees</th><th class="num">Miles</th></tr></thead><tbody>'+yrows+
    '<tr class="total"><td>Total</td><td class="num">'+tot.count+'</td><td class="num">'+money(tot.rev)+'</td><td class="num">'+money(tot.fees)+'</td><td class="num">'+NUM.format(tot.miles)+'</td></tr></tbody></table></div></section></div>';
}

/* ---------- driver overview ---------- */
function rangeOf(p,date,month){
  if(p==='Week'){var w=weekRange(date);return {p:p,start:w.start,end:w.end,label:'Week of '+weekLabel(w)};}
  var pp=parts(month+'-01'),last=new Date(pp[0],pp[1],0).getDate();
  return {p:p,start:month+'-01',end:month+'-'+pad(last),label:ymLabel(month)};
}
function driverStats(dr,r){
  var act=db.loads.filter(function(l){return l.driverId===dr.id&&(inRange(l.pickup,r)||inRange(l.delivery,r));});
  var done=db.loads.filter(function(l){return l.driverId===dr.id&&isDone(l)&&inRange(l.delivery,r);});
  return {dr:dr,act:act,done:done,n:act.length,deliv:done.length,
    loaded:act.reduce(function(a,l){return a+l.miles;},0),dead:act.reduce(function(a,l){return a+(l.deadhead||0);},0),
    rev:sumBy(done,function(l){return l.rate;}),fees:sumBy(done,loadFee)};
}
function pDriverOv(){
  var mine=session.role==='dispatcher',me=getEmp(session.empId);
  var r=rangeOf(ui.drvPeriod,ui.drvDate,ui.drvMonth);
  var picker=r.p==='Week'?dateInput('drvDate','',ui.drvDate,'date','aria-label="Any day in the week"'):dateInput('drvMonth','',ui.drvMonth,'month','aria-label="Month"');
  var controls='<div class="chips">'+['Week','Month'].map(function(p){return '<button class="chip" type="button" data-action="drv-period" data-p="'+p+'" aria-pressed="'+(ui.drvPeriod===p)+'">'+p+'</button>';}).join('')+'</div><div style="width:200px">'+picker+'</div>';
  var drvs=db.drivers.filter(function(d){return !mine||d.dispatcherId===session.empId;});
  var list=drvs.map(function(d){return driverStats(d,r);}).sort(function(a,b){return b.fees-a.fees||b.n-a.n;});
  var t={n:0,deliv:0,loaded:0,dead:0,rev:0,fees:0};
  var rows=list.map(function(s){
    t.n+=s.n;t.deliv+=s.deliv;t.loaded+=s.loaded;t.dead+=s.dead;t.rev+=s.rev;t.fees+=s.fees;
    var d=s.dr;
    return '<tr'+(s.n?'':' class="quiet"')+'><td><div class="stack"><b>'+esc(d.name)+'</b><span class="muted small">'+esc(d.carrier)+'</span></div></td>'+
      (mine?'':'<td>'+esc(d.dispatcherId?nm(getEmp(d.dispatcherId)):'—')+'</td>')+
      '<td class="num">'+s.n+'</td><td class="num">'+s.deliv+'</td><td class="num">'+NUM.format(s.loaded)+'</td><td class="num">'+NUM.format(s.dead)+'</td><td class="num"><b>'+NUM.format(s.loaded+s.dead)+'</b></td>'+
      '<td class="num">'+money(s.rev)+'</td><td class="num">'+money(s.fees)+'</td>'+
      '<td><div class="rowact"><button class="btn sm" type="button" data-action="driver-detail" data-id="'+d.id+'">Loads</button></div></td></tr>';}).join('');
  var active=list.filter(function(s){return s.n>0;}).length;
  return head('Driver overview',r.label+(mine&&me?' · '+me.name:''),controls)+
  '<div class="stats">'+
    statTile('Active drivers',String(active),'of '+drvs.length+(mine?' assigned to you':'')+' with a load in this '+r.p.toLowerCase())+
    statTile('Loads',String(t.n),plural(t.deliv,'load')+' delivered')+
    statTile('Total miles',NUM.format(t.loaded+t.dead),NUM.format(t.dead)+' deadhead miles')+
    statTile('Dispatch fees',money(r2(t.fees)),'on '+money(r2(t.rev))+' load revenue')+
  '</div>'+
  '<section class="panel"><header><div><h2>'+(mine?'My drivers':'Each driver')+'</h2><div class="muted small">'+(mine?'Drivers assigned to you as their dispatcher. ':'')+'Miles count loads picked up or delivered in the period. Revenue and fees count loads delivered in the period.</div></div></header>'+
    (rows?'<div class="tablewrap"><table class="tight" style="min-width:'+(mine?780:860)+'px"><thead><tr><th>Driver</th>'+(mine?'':'<th>Dispatcher</th>')+'<th class="num">Loads</th><th class="num">Delivered</th><th class="num">Loaded miles</th><th class="num">Deadhead miles</th><th class="num">Total miles</th><th class="num">Load revenue</th><th class="num">Dispatch fees</th><th></th></tr></thead><tbody>'+rows+
    '<tr class="total"><td>Total</td>'+(mine?'':'<td></td>')+'<td class="num">'+t.n+'</td><td class="num">'+t.deliv+'</td><td class="num">'+NUM.format(t.loaded)+'</td><td class="num">'+NUM.format(t.dead)+'</td><td class="num">'+NUM.format(t.loaded+t.dead)+'</td><td class="num">'+money(r2(t.rev))+'</td><td class="num">'+money(r2(t.fees))+'</td><td></td></tr></tbody></table></div>':'<div class="empty">'+(mine?'No drivers are assigned to you yet. A driver appears here once you are chosen as their dispatcher on the Drivers page.':'No drivers yet. Add drivers on the Drivers page.')+'</div>')+'</section>';
}
function driverDetail(id){
  var d=getDrv(id);if(!d)return;
  if(session.role==='dispatcher'&&d.dispatcherId!==session.empId)return;
  var r=rangeOf(ui.drvPeriod,ui.drvDate,ui.drvMonth),s=driverStats(d,r);
  var rows=s.act.slice().sort(function(a,b){return String(b.pickup).localeCompare(String(a.pickup));}).map(function(l){

function monthName(m){return new Date(2000,m-1,1).toLocaleDateString('en-US',{month:'long'});}
function inRange(s,r){return !!s&&s>=r.start&&s<=r.end;}
function ovRange(){
  var p=ui.ovPeriod;
  if(p==='Week'){var w=weekRange(ui.ovDate);return {p:p,start:w.start,end:w.end,label:'Week of '+weekLabel(w)};}
  if(p==='Month'){var ym=ui.ovMonth,pp=parts(ym+'-01'),last=new Date(pp[0],pp[1],0).getDate();return {p:p,start:ym+'-01',end:ym+'-'+pad(last),label:ymLabel(ym)};}
  var y=ui.ovYear;return {p:p,start:y+'-01-01',end:y+'-12-31',label:'Year '+y};
}
function rankBy(list,keyFn){
  var m={};
  list.forEach(function(l){
    var k=keyFn(l);if(!k)return;
    var a=m[k]=m[k]||{id:k,n:0,fees:0,drivers:{}};
    a.n++;a.fees+=loadFee(l);a.drivers[l.driverId]=1;
  });
  return Object.keys(m).map(function(k){var a=m[k];a.fees=r2(a.fees);a.nd=Object.keys(a.drivers).length;return a;});
}
function topGrossDispatcher(list){
  return rankBy(list,function(l){return l.dispatcherId;}).sort(function(a,b){return b.fees-a.fees||b.n-a.n;})[0]||null;
}
function topSalesAgent(list){
  return rankBy(list,function(l){return (getDrv(l.driverId)||{}).salesAgentId;}).sort(function(a,b){return b.n-a.n||b.fees-a.fees;})[0]||null;
}
function makeExpense(id,date,type,note,amount,currency,rate){
  var usd,rsv;
  if(currency==='Rs'){rsv=Math.round(amount);usd=r2(amount/rate);}else{usd=r2(amount);rsv=Math.round(amount*rate);}
  return {id:id,date:date,type:type,note:note,amount:amount,currency:currency,rate:rate,usd:usd,rs:rsv};
}
function dual(usd,rsv){return money(usd)+' · '+rs(rsv);}

function periodWord(p){return {Week:'this week',Month:'this month',Total:'in total'}[p]||'in total';}
function brokerUsage(c,ref,excludeId){
  var lim=Number(c.loadLimit)||0,per=c.limitPeriod||'Month';
  ref=ref||TODAY;
  var w=weekRange(ref),ym=String(ref).slice(0,7);
  var used=usageLoads().filter(function(l){
    if(l.customerId!==c.id||l.id===excludeId)return false;
    return per==='Week'?inWeek(l.pickup,w):per==='Month'?String(l.pickup).slice(0,7)===ym:true;
  }).length;
  return {limit:lim,used:used,left:lim?Math.max(0,lim-used):null,period:per};
}

/* ---------- payroll (Rs) ---------- */
function rs(n){if(n==null||isNaN(n))return '—';var v=Math.round(n);return (v<0?'−':'')+'Rs '+NUM.format(Math.abs(v));}
function fxFor(ym){
  if(db.fx[ym]!=null)return Number(db.fx[ym]);
  var ks=Object.keys(db.fx).filter(function(k){return k<ym;}).sort();
  return ks.length?Number(db.fx[ks[ks.length-1]]):null;
}
function adjFor(empId,ym){return db.payAdj[ym+'|'+empId]||{};}
function calcPay(e,ym){
  var agent=e.title==='Sales agent';
  var ls=db.loads.filter(function(l){
    var mine=agent?((getDrv(l.driverId)||{}).salesAgentId===e.id):(l.dispatcherId===e.id);
    return mine&&['Delivered','Invoiced','Paid'].indexOf(l.status)>-1&&String(l.delivery).slice(0,7)===ym;});
  var feesUsd=sumBy(ls,loadFee);
  var adj=adjFor(e.id,ym);
  var pct=adj.commissionPct!=null?Number(adj.commissionPct):(Number(e.commissionPct)||0);
  var rate=fxFor(ym);
  var base=agent?Math.round(Number(e.base)||0):0;
  var commission=rate==null?null:Math.round(feesUsd*(pct/100)*rate);
  var fines=Math.round(Number(adj.fines)||0);
  var advance=Math.round(Number(adj.advance)||0);
  var gross=commission==null?null:base+commission;
  return {empId:e.id,ym:ym,base:base,loads:ls.length,feesUsd:feesUsd,rate:rate,commissionPct:pct,commissionUsd:r2(feesUsd*(pct/100)),commission:commission,fines:fines,fineNote:adj.fineNote||'',advance:advance,gross:gross,net:gross==null?null:gross-fines-advance};
}
function slipComUsd(p){return p.commissionUsd!=null?p.commissionUsd:r2((p.feesUsd||0)*(p.commissionPct||0)/100);}

function slipNums(o){
  var base=Math.round(Number(o.base)||0),commission=Math.round(Number(o.commission)||0),adv=Math.round(Number(o.advance)||0),fines=Math.round(Number(o.fines)||0);
  return {gross:base+commission,net:base+commission-adv-fines};
}

  var n=slipNums(p);
  openModal(sheetHead('Edit payslip '+p.no)+
  '<form class="form" data-form="slipedit"><input type="hidden" name="id" value="'+esc(p.id)+'">'+
    field('Payslip number','no',p.no,{required:true})+
    field('Employee','empId',p.empId,{type:'select',options:db.employees.map(function(e){return [e.id,e.name+' · '+e.title];})})+
    field('Pay month','ym',p.ym,{type:'month',required:true})+
    field('Issue date','issued',p.issued,{type:'date',required:true})+
    field('Base salary (Rs)','base',p.base,{type:'number',step:'1',min:0,hint:'Leave 0 for dispatchers.'})+
    field('Loads counted','loads',p.loads,{type:'number',step:'1',min:0})+
    field('Dispatch fees ($)','feesUsd',p.feesUsd,{type:'number',step:'0.01',min:0})+
    field('Exchange rate (Rs per $1)','rate',p.rate,{type:'number',step:'0.01',min:0})+
    field('Commission (%)','commissionPct',p.commissionPct,{type:'number',step:'0.1',min:0,max:100})+
    field('Commission (Rs)','commission',p.commission,{type:'number',step:'1',min:0,hint:'Fees × percentage × rate. Type any amount to override it.'})+
    '<div class="full"><button class="btn sm" type="button" data-action="slip-recalc">Recalculate commission from fees, % and rate</button></div>'+
    field('Advance taken (Rs)','advance',p.advance||0,{type:'number',step:'1',min:0})+
    field('Fines (Rs)','fines',p.fines||0,{type:'number',step:'1',min:0})+
    field('Reason for the fine','fineNote',p.fineNote||'',{full:true})+
    '<div class="full invprev"><span>Gross pay</span><b id="slipPrevG">'+rs(n.gross)+'</b><span>Net pay</span><b id="slipPrevN">'+rs(n.net)+'</b></div>'+
    '<div class="formfoot"><button class="btn danger" type="button" data-action="delete-slip" data-id="'+esc(p.id)+'">Delete payslip</button><button class="btn" type="button" data-action="cancel-edit-slip" data-id="'+esc(p.id)+'">Cancel</button><button class="btn primary" type="submit">Save payslip</button></div></form>',true);
}
function slipPreview(f){
  var v=function(k){var el=f.querySelector('[name='+k+']');return el?el.value:0;};
  var n=slipNums({base:v('base'),commission:v('commission'),advance:v('advance'),fines:v('fines')});
  var g=$('slipPrevG'),t=$('slipPrevN');if(g)g.textContent=rs(n.gross);if(t)t.textContent=rs(n.net);
}

function slipFor(empId,ym){return db.payslips.find(function(p){return p.empId===empId&&p.ym===ym;});}
function pPayroll(){
  var ym=ui.ym,rate=fxFor(ym),saved=db.fx[ym]!=null;
  var rows=db.employees.map(function(e){return calcPay(e,ym);});
  var netTotal=rate==null?null:rows.reduce(function(a,r){return a+r.net;},0);
  var tbl=rows.map(function(r){
    var e=getEmp(r.empId),sl=slipFor(r.empId,ym);
    if(sl&&sl.manual){r=Object.assign({},r,{base:sl.base,loads:sl.loads,feesUsd:sl.feesUsd,commissionPct:sl.commissionPct,commission:sl.commission,commissionUsd:slipComUsd(sl),advance:sl.advance||0,fines:sl.fines||0,net:sl.net});}
    var stale=sl&&!sl.manual&&r.net!=null&&(sl.net!==r.net||sl.rate!==r.rate||sl.commissionPct!==r.commissionPct||sl.fines!==r.fines||(sl.advance||0)!==r.advance);
    return '<tr><td><div class="stack"><b>'+esc(e.name)+'</b><span class="muted small">'+esc(e.title)+'</span></div></td>'+

function issueSlip(empId,ym){
  var e=getEmp(empId);if(!e)return null;
  var c=calcPay(e,ym);if(c.rate==null)return null;
  var old=slipFor(empId,ym);
  if(old){Object.assign(old,c,{issued:TODAY,manual:false});return old;}
  db.seq.payslip+=1;
  c.id=uid('ps');c.no='PS-'+ym.replace('-','')+'-'+String(db.seq.payslip).padStart(3,'0');c.issued=TODAY;
  db.payslips.push(c);return c;
}

    if(el.dataset.armed!=='1'){el.dataset.armed='1';el.textContent='Click again to delete';return;}
    var inv=getInv(el.dataset.id);if(!inv)return;
    inv.loadIds.forEach(function(id){var l=getLoad(id);if(l){l.status='Delivered';l.invoiceId='';}});
    db.invoices=db.invoices.filter(function(x){return x.id!==inv.id;});
    persist();closeModal();render();toast('Invoice deleted. Its loads are ready to invoice again.');},
  'edit-slip':function(el){if(!can('payroll'))return;var p=db.payslips.find(function(x){return x.id===el.dataset.id;});if(p)slipEditForm(p);},
  'cancel-edit-slip':function(el){openSlip(el.dataset.id);},
  'slip-recalc':function(el){
    var f=el.closest('form'),g=function(k){return Number(f.querySelector('[name='+k+']').value)||0;};
    f.querySelector('[name=commission]').value=Math.round(g('feesUsd')*g('commissionPct')/100*g('rate'));slipPreview(f);},
  'delete-slip':function(el){
    if(!can('payroll'))return;
    if(el.dataset.armed!=='1'){el.dataset.armed='1';el.textContent='Click again to delete';return;}
    db.payslips=db.payslips.filter(function(x){return x.id!==el.dataset.id;});
    persist();closeModal();render();toast('Payslip deleted');},
  'set-pw':function(el){pwForm(el.dataset.id);},
  'new-login':function(){newLoginForm();},
  'del-login':function(el){
    var p=profiles.find(function(x){return x.user_id===el.dataset.id;});if(!p||!canManage(p))return;
    if(el.dataset.armed!=='1'){el.dataset.armed='1';el.textContent='Click again to remove';return;}
    sb.rpc('admin_delete_login',{p_user:p.user_id}).then(function(r){
      if(r.error){toast(r.error.message);return;}
      return fetchAll('profiles','*').then(function(x){profiles=x;render();toast('Login removed. The person can no longer sign in.');});});},
  'adjust-pay':function(el){if(!can('payroll'))return;adjForm(el.dataset.emp);},
  'copy-slip':function(el){var p=db.payslips.find(function(x){return x.id===el.dataset.id;});copyText(slipText(p));}
};
function openSlip(id){
  var p=db.payslips.find(function(x){return x.id===id;});if(!p)return;
  openModal(sheetHead('Payslip '+p.no)+slipDoc(p)+
    '<div class="actions" style="justify-content:flex-end"><button class="btn" type="button" data-action="copy-slip" data-id="'+p.id+'">Copy as text</button>'+
    (can('payroll')?'<button class="btn primary" type="button" data-action="edit-slip" data-id="'+p.id+'">Edit payslip</button>':'')+'</div>',true);
}

var forms={
  'slipedit':function(f){
    if(!can('payroll'))return;
    var d=formData(f),p=db.payslips.find(function(x){return x.id===d.id;});if(!p)return;
    var no=String(d.no||'').trim();
    if(!no){toast('Enter a payslip number.');return;}
    if(db.payslips.some(function(x){return x.id!==p.id&&String(x.no).toLowerCase()===no.toLowerCase();})){toast('Another payslip already uses that number.');return;}
    var e=getEmp(d.empId);if(!e){toast('Choose an employee.');return;}
    if(!okMonth(d.ym)){toast('Enter the pay month as YYYY-MM.');return;}
    if(!okDate(d.issued)){toast('Enter the issue date as YYYY-MM-DD, or pick it from the calendar.');return;}
    if(db.payslips.some(function(x){return x.id!==p.id&&x.empId===d.empId&&x.ym===d.ym;})){toast('That employee already has a payslip for that month.');return;}
    var o={no:no,empId:d.empId,ym:d.ym,issued:d.issued,base:Math.round(numv(d.base)),loads:Math.round(numv(d.loads)),feesUsd:r2(numv(d.feesUsd)),rate:numv(d.rate),commissionPct:numv(d.commissionPct),commission:Math.round(numv(d.commission)),advance:Math.round(numv(d.advance)),fines:Math.round(numv(d.fines)),fineNote:(d.fineNote||'').trim()};
    var n=slipNums(o);o.gross=n.gross;o.net=n.net;o.commissionUsd=r2(o.feesUsd*o.commissionPct/100);
    Object.assign(p,o);
    var c=calcPay(e,d.ym);
    p.manual=!(c.rate!=null&&c.net===p.net&&c.commission===p.commission&&c.base===p.base&&c.loads===p.loads&&c.rate===p.rate&&c.commissionPct===p.commissionPct&&c.fines===p.fines&&c.advance===p.advance&&Math.abs(c.feesUsd-p.feesUsd)<0.005);
    persist();render();openSlip(p.id);toast('Payslip saved');
  },
  'expense':function(f){
    if(!can('expenses'))return;
    var d=formData(f),amt=numv(d.amount),rate=numv(d.rate);
    if(!okDate(d.date)){toast('Enter the date as YYYY-MM-DD, or pick it from the calendar.');return;}
    if(!d.note.trim()){toast('Add a description.');return;}
    if(amt<=0){toast('Enter an amount above 0.');return;}
    if(rate<=0){toast('Enter the exchange rate.');return;}
    var rec=makeExpense(d.id||uid('x'),d.date,d.type,d.note.trim(),amt,d.currency,rate);
    var i=db.expenses.findIndex(function(x){return x.id===rec.id;});
    if(i>-1)db.expenses[i]=rec;else db.expenses.push(rec);
    persist();closeModal();render();toast('Expense saved');
  },
  'invedit':function(f){
    if(!can('invoice'))return;
    var dr=readInvDraft(f),inv=getInv(dr.id);if(!inv)return;
    var no=String(dr.no).trim();
    if(!no){toast('Enter an invoice number.');return;}
    if(db.invoices.some(function(x){return x.id!==inv.id&&String(x.no).toLowerCase()===no.toLowerCase();})){toast('Another invoice already uses that number.');return;}
    if(!getDrv(dr.driverId)){toast('Choose a driver.');return;}
    if(!okDate(dr.issued)||!okDate(dr.due)){toast('Enter both dates as YYYY-MM-DD, or pick them from the calendar.');return;}
    if(dr.due<dr.issued){toast('The due date is before the issue date.');return;}
    if(dr.paidOn&&!okDate(dr.paidOn)){toast('Enter the paid date as YYYY-MM-DD, or leave it blank.');return;}
    if(!dr.lines.length){toast('An invoice needs at least one load. Use Delete invoice to remove it.');return;}
    if(dr.lines.some(function(x){return !(Number(x.fee)>=0);})){toast('Dispatch fees cannot be negative.');return;}
    var paid=dr.status==='Paid',oldIds=inv.loadIds.slice(),fees={},ids=[];
    dr.lines.forEach(function(x){ids.push(x.id);fees[x.id]=r2(Number(x.fee)||0);});
    oldIds.forEach(function(id){if(ids.indexOf(id)<0){var l=getLoad(id);if(l){l.status='Delivered';l.invoiceId='';}}});
    ids.forEach(function(id){var l=getLoad(id);if(l){l.status=paid?'Paid':'Invoiced';l.invoiceId=inv.id;}});
    inv.no=no;inv.driverId=dr.driverId;inv.issued=dr.issued;inv.due=dr.due;inv.terms=daysBetween(dr.issued,dr.due);
    inv.loadIds=ids;inv.fees=fees;inv.status=paid?'Paid':'Sent';inv.paidOn=paid?(dr.paidOn||TODAY):'';
    inv.adj=Number(dr.adjAmount)?{label:(dr.adjLabel||'').trim()||'Adjustment',amount:r2(Number(dr.adjAmount))}:null;
    inv.note=dr.note.trim();inv.total=invTotal(inv);
    persist();render();viewInvoice(inv.id);toast('Invoice saved');
  },
  'pw':function(f){
    var d=formData(f),pw=String(d.pw||'');
    var p=profiles.find(function(x){return x.user_id===d.uid;});if(!p||!canManage(p)){toast('You cannot change this password.');return;}
    if(pw.length<8){toast('Use at least 8 characters.');return;}
    return sb.rpc('admin_set_password',{p_user:d.uid,p_pw:pw}).then(function(r){
      if(r.error){toast(r.error.message);return;}
      closeModal();toast('Password saved for '+(p.name||p.email));});
  },
  'newlogin':function(f){
    var d=formData(f),email=String(d.email||'').trim().toLowerCase(),pw=String(d.pw||''),role=d.role;
    if(session.role!=='admin'&&role!=='dispatcher'){toast('Only the admin can create this login.');return;}
    if(role==='dispatcher'&&!d.empId){toast('Choose which dispatcher this is.');return;}
    if(pw.length<8){toast('Use at least 8 characters for the password.');return;}
    var btn=f.querySelector('button[type=submit]');if(btn){btn.disabled=true;btn.textContent='Creating…';}
    var tmp=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'zulu-newuser'}});
    var fail=function(m){toast(m);if(btn){btn.disabled=false;btn.textContent='Create login';}};
    return tmp.auth.signUp({email:email,password:pw}).then(function(r){
      if(r.error){fail(r.error.message);return;}
      var u=r.data&&r.data.user;
      if(!u||(u.identities&&u.identities.length===0)){fail('That email already has an account.');return;}
      var needConfirm=!r.data.session;
      return sb.rpc('admin_create_profile',{p_user:u.id,p_role:role,p_emp:role==='dispatcher'?d.empId:'',p_name:String(d.name||'').trim(),p_email:email}).then(function(r2){
        if(r2.error){fail(r2.error.message);return;}
        return fetchAll('profiles','*').then(function(x){profiles=x;closeModal();render();
          toast(needConfirm?'Login created, but Supabase is asking for email confirmation. Turn off "Confirm email" in Supabase.':'Login created for '+email);});
      });
    },function(){fail('Could not reach the database.');});
  },
  'fx':function(f){
    if(!can('payroll'))return;
    var r=numv(formData(f).rate);
    if(r<=0){toast('Enter a rate above 0.');return;}
    db.fx[ui.ym]=r;persist();render();toast('Rate saved for '+ymLabel(ui.ym));
  },
  'adj':function(f){
    if(!can('payroll'))return;
    var d=formData(f);
    db.payAdj[ui.ym+'|'+d.emp]={commissionPct:numv(d.commissionPct),advance:Math.round(numv(d.advance)),fines:Math.round(numv(d.fines)),fineNote:(d.fineNote||'').trim()};
    persist();closeModal();render();
    toast(slipFor(d.emp,ui.ym)?'Saved. Re-issue the payslip to update it.':'Saved');
  },
  'login':function(f){
    var d=formData(f);
    var btn=f.querySelector('button[type=submit]');if(btn){btn.disabled=true;btn.textContent='Signing in…';}
    return sb.auth.signInWithPassword({email:String(d.email||'').trim(),password:String(d.pin||'')}).then(function(r){
      if(r.error){renderLogin('That email or password is not correct.');return;}
      return startSession();
    },function(e){renderLogin('Could not reach the database. Check your internet connection.');});
  },
  'load':function(f){
    var d=formData(f),l=d.id?getLoad(d.id):null;
    if(l&&(l.status==='Invoiced'||l.status==='Paid')){closeModal();return;}
    var rec={ref:d.ref.trim(),driverId:d.driverId,customerId:d.customerId,dispatcherId:d.dispatcherId,origin:d.origin.trim(),dest:d.dest.trim(),pickup:d.pickup,delivery:d.delivery,miles:numv(d.miles),deadhead:numv(d.deadhead),rate:r2(numv(d.rate)),extras:0,status:d.status};
    if(!okDate(rec.pickup)||!okDate(rec.delivery)){toast('Enter the dates as YYYY-MM-DD, or pick them from the calendar.');return;}
    if(rec.delivery<rec.pickup){toast('Delivery date is before pickup.');return;}
    var bro=getCust(rec.customerId);
    if(bro&&(!l||l.customerId!==rec.customerId||l.pickup!==rec.pickup)){
      var bu=brokerUsage(bro,rec.pickup,l?l.id:'');
      if(bu.limit&&bu.used>=bu.limit){toast(bro.name+' is at its limit of '+bu.limit+' loads '+periodWord(bu.period)+'. Raise the limit on the Brokers page first.');return;}
    }
    if(l)Object.assign(l,rec);
    else{db.seq.load+=1;rec.id=uid('l');rec.invoiceId='';db.loads.push(rec);}
    persist();closeModal();render();toast('Load saved'+(session.role==='dispatcher'&&rec.dispatcherId!==session.empId?'. Assigned to '+nm(getEmp(rec.dispatcherId))+', so it is listed under them.':''));
  },
  'driver':function(f){
    var d=formData(f),rec={name:d.name.trim(),carrier:d.carrier.trim(),mc:d.mc.trim(),phone:d.phone.trim(),email:(d.email||'').trim(),feePct:numv(d.feePct),salesAgentId:d.salesAgentId||'',dispatcherId:d.dispatcherId||''};
    if(d.id)Object.assign(getDrv(d.id),rec);else{rec.id=uid('d');db.drivers.push(rec);}
    persist();closeModal();render();toast('Driver saved');
  },
  'customer':function(f){
    var d=formData(f),rec={contact:d.contact.trim(),name:d.name.trim(),phone:d.phone.trim(),ext:(d.ext||'').trim(),email:(d.email||'').trim(),loadLimit:Math.max(0,Math.round(numv(d.loadLimit))),limitPeriod:d.limitPeriod||'Month'};
    if(d.id)Object.assign(getCust(d.id),rec);else{rec.id=uid('c');db.customers.push(rec);}
    persist();closeModal();render();toast('Broker saved');
  },
  'emp':function(f){
    var d=formData(f),rec={name:d.name.trim(),title:d.title,base:d.title==='Dispatcher'?0:Math.round(numv(d.base)),commissionPct:numv(d.commissionPct)};
    if(d.id)Object.assign(getEmp(d.id),rec);else{rec.id=uid('e');db.employees.push(rec);}
    persist();closeModal();render();toast('Employee saved');
  },
  'settings':function(f){
    if(session.role!=='admin')return;
    var d=formData(f),s=db.settings;
    s.company=d.company.trim();s.phone=d.phone.trim();s.email=d.email.trim();s.address=d.address;s.payInstr=d.payInstr;s.invTerms=numv(d.invTerms);
    persist();render();toast('Settings saved');
  }
};

/* ---------- wiring ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-action]');
  if(!el||el.tagName==='INPUT')return;
  var fn=actions[el.dataset.action];
  if(fn){e.preventDefault();fn(el);}
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');
  if(!f)return;
  e.preventDefault();
  var fn=forms[f.dataset.form];if(fn)fn(f);
});
document.addEventListener('change',function(e){
  var t=e.target;if(!t)return;
  if(t.id==='f_driverId'){var dr=getDrv(t.value),ds=$('f_dispatcherId');if(dr&&dr.dispatcherId&&ds&&session.role!=='dispatcher')ds.value=dr.dispatcherId;return;}
  if(t.name==='role'){var w=$('whoWrap');if(w)w.hidden=t.value!=='dispatcher';return;}
  if(t.id==='payMonth'&&okMonth(t.value)){ui.ym=t.value;render();}
  if(t.id==='ovDate'&&okDate(t.value)){ui.ovDate=t.value;render();}
  if(t.id==='drvDate'&&okDate(t.value)){ui.drvDate=t.value;render();}
  if(t.id==='drvMonth'&&okMonth(t.value)){ui.drvMonth=t.value;render();}
  if(t.id==='ovMonth'&&okMonth(t.value)){ui.ovMonth=t.value;render();}
  if(t.id==='dispDate'&&okDate(t.value)){ui.dispDate=t.value;render();}
  if(t.id==='ovYear'&&t.value){ui.ovYear=t.value;render();}
  if(t.id==='reportMonth'&&okMonth(t.value)){ui.reportYm=t.value;render();}
  if(t.id==='reportYear'&&t.value){ui.reportYear=t.value;render();}
});
document.addEventListener('input',function(e){
  var f=e.target&&e.target.closest?e.target.closest('form[data-form]'):null;if(!f)return;
  if(f.dataset.form==='invedit')invPreview(f);else if(f.dataset.form==='slipedit')slipPreview(f);
});
document.addEventListener('mousedown',function(e){
  if(CAL&&!e.target.closest('#cal')&&!e.target.closest('.calbtn'))closeCal();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(CAL){closeCal();return;}if(!$('modal').hidden)closeModal();}
});

/* ---------- boot ---------- */
db=blank();renderLogin('');
if(!window.supabase||SB_KEY==='__SB_KEY__'){
  $('root').innerHTML='<div class="login"><div class="logincard"><div class="plate"><b>'+esc(db.settings.company)+'</b><span>Dispatch portal</span></div><div class="err">The database connection is not set up yet.</div></div></div>';
} else {
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'zulu-portal-auth'}});
  sb.auth.getSession().then(function(r){if(r.data&&r.data.session)return startSession();});
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)refreshData(false);});
})();
</script>
</body></html>
