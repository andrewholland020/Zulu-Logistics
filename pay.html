<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>ZULU Driver Payment</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#0f1b2d;--muted:#5d6b7e;--line:#e3e8ef;--navy:#0b2545;--accent:#f28c28;--accent-soft:#fff2e5;--good:#1f8a4c;--good-soft:#e5f5eb;--warn:#a35400;--warn-soft:#fdeedd;--bad:#b3261e;--bad-soft:#fdecea;--blue:#1f5fbf;--blue-soft:#e8f0fc;--soft:#f3f5f8}
@media (prefers-color-scheme:dark){:root{--bg:#0d131c;--card:#151d29;--ink:#e8edf4;--muted:#9aa8bb;--line:#263246;--accent-soft:#3a2713;--good-soft:#173322;--warn-soft:#3a2a12;--bad-soft:#3b1a18;--blue-soft:#162a46;--soft:#101823}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:460px;margin:20px auto 40px;padding:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(15,27,45,.07)}
.brand{display:flex;gap:10px;align-items:center;padding:16px 18px 0}
.brand img{width:38px;height:38px;border-radius:10px;flex:none;background:var(--navy)}
.brand h1{font-size:15.5px;margin:0;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.top{padding:12px 18px 16px;border-bottom:1px solid var(--line)}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.p-pend{background:var(--accent-soft);color:var(--warn)}.p-wait{background:var(--blue-soft);color:var(--blue)}.p-paid{background:var(--good-soft);color:var(--good)}
.inv{margin-top:8px;font-weight:600;color:var(--muted)}
.amt{font-size:34px;font-weight:800;letter-spacing:-.5px;margin:0 0 4px}
.meta{display:flex;flex-wrap:wrap;gap:2px 14px;color:var(--muted);font-size:13px}
.meta b{color:var(--ink)}
details{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13.5px}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"Show";color:var(--blue);font-weight:500}
details[open] summary::after{content:"Hide"}
.lrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--line)}
.lrow:first-of-type{margin-top:8px}
.lrow span{color:var(--muted);font-size:12.5px}
.sec{padding:16px 18px 18px}
.sec h2{font-size:15px;margin:0 0 10px}
.method{width:100%;display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;text-align:left;margin-bottom:10px}
.method:hover{border-color:var(--accent)}
.mic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.zelle{background:#6d1ed4}.cash{background:#00c244}
.method b{display:block}.method small{color:var(--muted);font-size:12.5px}
.method .chev{margin-left:auto;color:var(--muted);font-size:20px}
.back{background:none;border:0;color:var(--blue);cursor:pointer;padding:0;margin-bottom:10px;font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px}
.steps li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.copyrow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px}
.copyrow code{font:600 14px ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere;min-width:0}
.copy{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px;flex:none}
.copy.ok{background:var(--good-soft);color:var(--good);border-color:transparent}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;margin-top:14px}
.btn:disabled{opacity:.6;cursor:wait}
.primary{background:var(--navy);color:#fff}.cashb{background:#00c244;color:#fff}.ghost{background:transparent;border:1px solid var(--line)}
.note{border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px}
.n-warn{background:var(--warn-soft);color:var(--warn)}.n-info{background:var(--blue-soft);color:var(--blue)}.n-bad{background:var(--bad-soft);color:var(--bad)}
label.f{display:block;margin-bottom:12px;font-size:13px;font-weight:600}
label.f input,label.f select{display:block;width:100%;margin-top:5px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);font-weight:400}
.big{text-align:center;padding:24px 18px}
.big .ic{width:60px;height:60px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-size:28px}
.big h2{margin:0 0 6px;font-size:19px}
.big p{color:var(--muted);margin:0}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:12px;border-top:1px solid var(--line)}
.err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 10px;font-size:13px;margin-top:10px}
.sk{height:16px;border-radius:6px;background:var(--line);margin:10px 0;animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{opacity:.5}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card"><div class="sec"><div class="sk" style="width:60%"></div><div class="sk" style="width:40%;height:34px"></div><div class="sk"></div><div class="sk" style="width:80%"></div></div></div></div>
<script>
(function(){
var SB_URL='https://ppwhvoemfkuiwckudlhm.supabase.co',SB_KEY='sb_publishable_5sgHPnVLB8R6xtEyjCZggQ_hIZ88-DZ';
var token=(new URLSearchParams(location.search).get('t')||'').replace(/[^A-Za-z0-9]/g,'');
var D=null,S={screen:'choose',method:'Zelle',sending:false,err:'',sent:false};
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(n){var v=Number(n)||0;return (v<0?'-$':'$')+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtD(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||''));return m?MON[+m[2]-1]+' '+(+m[3])+', '+m[1]:'';}
function rpc(name,args){
  return fetch(SB_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)})
    .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error((j&&j.message)||('Error '+r.status));return j;});});
}
function cp(t){return '<div class="copyrow"><code>'+esc(t).replace('@','@<wbr>')+'</code><button class="copy" type="button" data-copy="'+esc(t)+'">Copy</button></div>';}
function shell(inner,state){
  var co=D&&D.company?D.company:'ZULU Logistics';
  var pill=state==='paid'?'<span class="pill p-paid">&#10003; Paid</span>':state==='wait'?'<span class="pill p-wait">Payment sent · waiting for '+esc(co)+' to confirm</span>':'<span class="pill p-pend">Payment pending</span>';
  var loads=(D.loads||[]).map(function(l){return '<div class="lrow"><div><b>'+esc(l.ref)+'</b><br><span>'+esc(l.from)+' to '+esc(l.to)+(l.delivered?' · delivered '+esc(fmtD(l.delivered)):'')+'</span></div><b>'+money(l.fee)+'</b></div>';}).join('')+
    (Number(D.adjAmount)?'<div class="lrow"><div><b>Adjustment</b>'+(D.adjLabel&&D.adjLabel!=='Adjustment'?'<br><span>'+esc(D.adjLabel)+'</span>':'')+'</div><b>'+money(D.adjAmount)+'</b></div>':'');
  var n=(D.loads||[]).length;
  return '<div class="card"><div class="brand"><img src="icon-192.png" alt=""><div><h1>'+esc(co)+' · Driver Payment</h1><small>Dispatch fee invoice</small></div></div>'+
    '<div class="top">'+pill+'<div class="inv">Invoice #'+esc(D.no)+'</div><div class="amt">'+money(D.total)+'</div>'+
    '<div class="meta">'+(D.driver?'<span>Driver <b>'+esc(D.driver)+'</b></span>':'')+(D.carrier?'<span><b>'+esc(D.carrier)+'</b></span>':'')+(D.due&&state!=='paid'?'<span>Due <b>'+esc(fmtD(D.due))+'</b></span>':'')+'</div>'+
    (n?'<details><summary>'+n+' load'+(n>1?'s':'')+' on this invoice</summary>'+loads+'</details>':'')+'</div>'+
    inner+'<div class="foot">Secure payment page for invoice '+esc(D.no)+' only</div></div>';
}
function render(){
  var app=$('app');
  if(!D){return;}
  if(D.state==='bad'){app.innerHTML='<div class="card"><div class="big"><div class="ic" style="background:var(--bad-soft);color:var(--bad)">&#10006;</div><h2>This link is not active</h2><p>The link is not valid or is no longer active. Please contact ZULU Logistics for a new one.</p></div></div>';return;}
  if(D.state==='error'){app.innerHTML='<div class="card"><div class="big"><div class="ic" style="background:var(--warn-soft);color:var(--warn)">!</div><h2>Could not load the invoice</h2><p>Check your internet connection and try again.</p><button class="btn primary" type="button" data-retry>Try again</button></div></div>';return;}
  var co=esc(D.company||'ZULU Logistics'),contact=[D.phone,D.email].filter(Boolean).map(esc).join(' · ');
  if(D.paid){app.innerHTML=shell('<div class="big"><div class="ic" style="background:var(--good-soft);color:var(--good)">&#10003;</div><h2>This invoice is paid</h2><p>'+(D.paidOn?'Paid on '+esc(fmtD(D.paidOn))+'. ':'')+'Thank you, nothing more to do.</p></div>','paid');return;}
  var c=D.claim;
  if(S.sent||(c&&c.status==='new')){
    app.innerHTML=shell('<div class="big"><div class="ic" style="background:var(--blue-soft);color:var(--blue)">&#9203;</div><h2>Thanks, we got your message</h2><p>'+co+' will check the payment and mark this invoice paid. This page will then show <b>Paid</b>.</p>'+
      '<div class="note n-info" style="text-align:left">Please also reply to the invoice email with a screenshot of the payment'+(contact?', or contact us: '+contact:'')+'.</div>'+
      '<button class="btn ghost" type="button" data-go="choose" data-reset>See the payment details again</button></div>','wait');return;}
  var inner='',p=S.screen,hasZ=!!D.zelle,hasC=!!D.cashtag;
  if(!hasZ&&!hasC)p='none';
  var nf=c&&c.status==='not_received'?'<div class="note n-bad">We could not find your payment yet. Please check it went to the account below'+(contact?', or contact us: '+contact:'')+'.</div>':'';
  if(p==='none')inner='<div class="sec">'+nf+'<div class="note n-info">Payment details are not set up yet. Please contact '+co+(contact?': '+contact:'')+'.</div></div>';
  else if(p==='choose')inner='<div class="sec">'+nf+'<h2>Choose payment method</h2>'+
      (hasZ?'<button class="method" type="button" data-go="zelle"><span class="mic zelle">Z</span><span><b>Zelle</b><small>From your bank app</small></span><span class="chev">&#8250;</span></button>':'')+
      (hasC?'<button class="method" type="button" data-go="cash"><span class="mic cash">$</span><span><b>Cash App</b><small>Opens Cash App with the amount filled in</small></span><span class="chev">&#8250;</span></button>':'')+
      '<div class="note n-warn">&#9888; '+co+' only takes payment to the accounts on this page. If anyone asks you to pay a different account, call us first'+(D.phone?' at '+esc(D.phone):'')+'.</div></div>';
  else if(p==='zelle')inner='<div class="sec"><button class="back" type="button" data-go="choose">&#8249; Other payment methods</button><h2>Pay with Zelle</h2><ol class="steps">'+
      '<li><div>Open your <b>bank app</b> and go to <b>Zelle</b> &rarr; Send.</div></li>'+
      '<li><div>Send to'+cp(D.zelle)+(D.zelleName?'<div style="font-size:13px;color:var(--muted);margin-top:4px">The name must show as <b>'+esc(D.zelleName)+'</b>. If it shows another name, stop and call us.</div>':'')+'</div></li>'+
      '<li><div>Amount'+cp(Number(D.total).toFixed(2))+'</div></li>'+
      '<li><div>In the memo, write the invoice number'+cp(D.no)+'</div></li></ol>'+
      '<button class="btn primary" type="button" data-go="confirm" data-m="Zelle">I have sent the payment</button></div>';
  else if(p==='cash'){var tag='$'+String(D.cashtag).replace(/[^A-Za-z0-9_-]/g,''),url='https://cash.app/'+tag+'/'+(Number(D.total)||0).toFixed(2);
    inner='<div class="sec"><button class="back" type="button" data-go="choose">&#8249; Other payment methods</button><h2>Pay with Cash App</h2><ol class="steps">'+
      '<li><div>Tap the button. Cash App opens to <b>'+esc(tag)+'</b> with <b>'+money(D.total)+'</b> filled in.<a class="btn cashb" style="margin-top:8px" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Open Cash App</a></div></li>'+
      '<li><div>Or send it yourself to'+cp(tag)+'</div></li>'+
      '<li><div>In <b>For</b>, write the invoice number'+cp(D.no)+'</div></li></ol>'+
      '<button class="btn primary" type="button" data-go="confirm" data-m="Cash App">I have sent the payment</button></div>';}
  else if(p==='confirm')inner='<div class="sec"><button class="back" type="button" data-go="'+(S.method==='Cash App'?'cash':'zelle')+'">&#8249; Back</button><h2>Tell us you paid</h2>'+
      '<label class="f">Paid with<select id="pm">'+(hasZ?'<option'+(S.method==='Zelle'?' selected':'')+'>Zelle</option>':'')+(hasC?'<option'+(S.method==='Cash App'?' selected':'')+'>Cash App</option>':'')+'</select></label>'+
      '<label class="f">Confirmation / transaction number <span style="font-weight:400;color:var(--muted)">(optional)</span><input id="pc" maxlength="40" autocomplete="off" placeholder="e.g. 7HG3K2M9"></label>'+
      '<button class="btn primary" type="button" data-claim'+(S.sending?' disabled':'')+'>'+(S.sending?'Sending…':'Send to '+co)+'</button>'+
      (S.err?'<div class="err">'+esc(S.err)+'</div>':'')+
      '<div class="note n-info">This only tells '+co+' to look for your payment. The invoice turns Paid after we see the money. Please also send the screenshot by replying to the invoice email.</div></div>';
  app.innerHTML=shell(inner,'pend');
}
function load(){
  if(token.length<24){D={state:'bad'};render();return;}
  rpc('zulu_pay_info',{p_token:token}).then(function(j){
    if(!j||j.off){D={state:'bad'};}else{D=j;document.title='Invoice '+(j.no||'')+' · '+(j.company||'ZULU')+' payment';}
    render();
  }).catch(function(){D={state:'error'};render();});
}
document.addEventListener('click',function(e){
  var t;
  if(t=e.target.closest('[data-copy]')){var v=t.dataset.copy;var ok=function(){t.textContent='Copied';t.classList.add('ok');setTimeout(function(){t.textContent='Copy';t.classList.remove('ok');},1500);};
    try{navigator.clipboard.writeText(v).then(ok,function(){fallback(v);ok();});}catch(x){fallback(v);ok();}return;}
  if(e.target.closest('[data-retry]')){load();return;}
  if(t=e.target.closest('[data-go]')){S.screen=t.dataset.go;if(t.dataset.m)S.method=t.dataset.m;if(t.hasAttribute('data-reset')){S.sent=false;if(D.claim)D.claim.status='seen';}S.err='';render();window.scrollTo(0,0);return;}
  if(e.target.closest('[data-claim]')){if(S.sending)return;S.method=$('pm')?$('pm').value:S.method;var conf=$('pc')?$('pc').value:'';S.sending=true;S.err='';render();
    rpc('zulu_pay_claim',{p_token:token,p_method:S.method,p_conf:conf}).then(function(j){
      S.sending=false;
      if(j&&j.ok){S.sent=true;}
      else if(j&&j.error==='paid'){D.paid=true;}
      else if(j&&j.error==='too_many'){S.err='We already got your message today. We will check the payment soon.';}
      else{S.err='This link is no longer active. Please contact us.';}
      render();window.scrollTo(0,0);
    }).catch(function(){S.sending=false;S.err='Could not send. Check your internet and try again.';render();});
    return;}
});
function fallback(v){var a=document.createElement('textarea');a.value=v;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');}catch(x){}document.body.removeChild(a);}
load();
})();
</script>
</body>
</html>
